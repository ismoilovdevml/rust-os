[package]
name = "rust_os"
version = "0.2.0"
edition = "2024"
description = "A small x86_64 kernel written in Rust"
license = "MIT"
repository = "https://github.com/ismoilovdevml/rust-os"

[dependencies]
bootloader = { version = "0.9.31", features = ["map_physical_memory"] }
x86_64 = "0.15.5"
spin = "0.9.8"
uart_16550 = "0.6.0"
pic8259 = "0.11.0"
pc-keyboard = "0.9.0"
linked_list_allocator = "0.10.5"

[dependencies.crossbeam-queue]
version = "0.3.13"
default-features = false
features = ["alloc"]

[dependencies.conquer-once]
version = "0.4.0"
default-features = false

[dependencies.futures-util]
version = "0.3.33"
default-features = false
features = ["alloc"]

# Integration tests under `tests/` link against the crate, not its dependency
# graph, so anything they name directly has to be repeated here.
[dev-dependencies]
bootloader = { version = "0.9.31", features = ["map_physical_memory"] }
x86_64 = "0.15.5"
spin = "0.9.8"

# Each of these asserts a single fatal event, so neither can use the normal
# multi-test harness.
[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[package.metadata.bootimage]
run-args = ["-serial", "stdio"]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none",
]
test-success-exit-code = 33 # (0x10 << 1) | 1
test-timeout = 60
