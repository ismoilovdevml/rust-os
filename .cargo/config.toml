# `x86_64-unknown-none` is a tier-2 built-in target that already implies
# panic=abort, no redzone and soft-float — the settings this kernel used to
# carry in a hand-written JSON target spec. Using it means `core`, `alloc` and
# `compiler_builtins` come precompiled, so no `build-std` is needed.
[build]
target = "x86_64-unknown-none"

# That target defaults to a position-independent executable linked at address
# 0, which the bootloader cannot load — it maps segments at their stated
# addresses and collides with its own identity mapping. These two flags pin the
# kernel to a fixed, non-PIE image instead.
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=--image-base=0x200000",
    "-C", "link-arg=-no-pie",
]

# `cargo run` / `cargo test` build a bootable image and launch it in QEMU.
# The wrapper exists to work around a stale assumption in `bootimage`; see the
# comments in the script.
[target.x86_64-unknown-none]
runner = "scripts/qemu-runner.sh"
